# Reusable CI for Node/Express backends (optional lint, typecheck, tests, build, secret scan).
# Caller: uses: org/CI-Pipeline/.github/workflows/reusable-node-ci.yml@main

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version
        type: string
        default: "20"
      working-directory:
        description: Directory containing package.json
        type: string
        default: "."
      run-lint:
        description: Run ESLint via npm run lint (set false if no lint script)
        type: boolean
        default: false
      typecheck-command:
        description: Typecheck command (e.g. npm run check)
        type: string
        default: "npm run check"
      run-tests:
        description: Run tests via test-command
        type: boolean
        default: true
      test-command:
        description: Test command
        type: string
        default: "npm test"
      run-npm-audit:
        description: Run npm audit for dependency vulnerability scanning
        type: boolean
        default: false
      run-prettier:
        description: Run Prettier format check
        type: boolean
        default: false
      run-semgrep:
        description: Run Semgrep SAST security scan
        type: boolean
        default: false
      run-license-check:
        description: Run license-checker for license compliance
        type: boolean
        default: false
      coverage-threshold:
        description: Minimum code coverage percentage (0 = disabled)
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        if: inputs.run-lint
        run: npm run lint
      - name: Lint skipped
        if: ${{ !inputs.run-lint }}
        run: echo "run-lint=false — skipping npm run lint"
      - name: Prettier format check
        if: inputs.run-prettier
        run: npx prettier --check .
      - name: License compliance check
        if: inputs.run-license-check
        run: npx license-checker --onlyAllow "MIT;ISC;Apache-2.0;BSD-2-Clause;BSD-3-Clause;0BSD;CC0-1.0;Unlicense;Python-2.0;CC-BY-3.0;CC-BY-4.0" --excludePrivatePackages

  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: ${{ inputs.typecheck-command }}

  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Dependency vulnerability scan
        if: inputs.run-npm-audit
        run: npm audit --audit-level=high
      - name: Test
        if: inputs.run-tests
        env:
          COV_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          if [ "${COV_THRESHOLD:-0}" -gt "0" ]; then
            ${{ inputs.test-command }} --coverage --coverageThreshold="{\"global\":{\"lines\":${COV_THRESHOLD},\"statements\":${COV_THRESHOLD},\"functions\":${COV_THRESHOLD},\"branches\":${COV_THRESHOLD}}}"
          else
            ${{ inputs.test-command }}
          fi
      - name: Skip tests
        if: ${{ !inputs.run-tests }}
        run: echo "run-tests=false — skipping tests"

  sast:
    if: inputs.run-semgrep
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: SAST — Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto --severity=WARNING --error .

  build:
    needs: [lint, typecheck, unit, sast]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar xzf gitleaks_8.24.3_linux_x64.tar.gz
          EXIT_CODE=0
          ./gitleaks detect --source=. --verbose || EXIT_CODE=$?
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::error::Gitleaks found secrets in this repository!"
            exit 1
          elif [ "$EXIT_CODE" -eq 2 ]; then
            echo "::warning::Gitleaks encountered an error (exit 2), but no leaks were found. Continuing."
            exit 0
          fi
          echo "✅ No leaks found"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
